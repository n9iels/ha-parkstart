# A saved plate is picked as the target: one plate (any of its entities, or its device) per call.
.plate_target: &plate_target
  entity:
    - integration: parkstart
      domain: binary_sensor
    - integration: parkstart
      domain: sensor
      device_class: timestamp
  device:
    integration: parkstart
    model: License plate

.permit_field: &permit_field
  selector:
    device:
      filter:
        integration: parkstart
        model: Permit

start_session:
  target: *plate_target
  fields:
    license_plate:
      example: "XX-000-X"
      selector:
        text:
    duration:
      selector:
        duration:
    end_time:
      selector:
        datetime:
    permit: *permit_field

stop_session:
  target: *plate_target
  fields:
    license_plate:
      example: "XX-000-X"
      selector:
        text:
    session_id:
      example: 3000001
      selector:
        text:
    permit: *permit_field
